<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel – Spendly</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin" data-title="Admin Panel">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content">
      <div class="grid c3" style="margin-bottom:16px">
        <div class="card stat"><div class="label">Total users</div><div class="value" id="aU">–</div></div>
        <div class="card stat"><div class="label">Active today</div><div class="value green" id="aA">–</div></div>
        <div class="card stat"><div class="label">Transactions (all users)</div><div class="value" id="aT">–</div></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="between" style="margin-bottom:12px;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Users</h3>
          <input id="aq" placeholder="Search name or email..." style="max-width:280px"></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th>Action</th></tr></thead>
          <tbody id="uRows"></tbody></table></div>
      </div>
      <div class="card"><h3>Default categories</h3>
        <div class="row" style="margin-bottom:12px"><input id="dName" placeholder="New default category" maxlength="60">
          <select id="dType"><option value="expense">Expense</option><option value="income">Income</option></select></div>
        <button class="btn sm" id="dAdd" style="margin-bottom:14px">Add default category</button>
        <div id="dList"></div></div>
    </div>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
