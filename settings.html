<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings – Spendly</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="settings" data-title="Settings">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content">
      <div class="grid c2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        <div class="card"><h3>Profile</h3><div id="pMsg"></div>
          <div class="field"><label for="pName">Name</label><input id="pName" maxlength="100"></div>
          <div class="field"><label for="pEmail">Email</label><input id="pEmail" type="email"></div>
          <button class="btn" id="pSave">Save profile</button></div>
        <div class="card"><h3>Change password</h3><div id="wMsg"></div>
          <div class="field"><label for="wCur">Current password</label><input id="wCur" type="password" autocomplete="current-password"></div>
          <div class="field"><label for="wNew">New password <span class="muted">(min. 8)</span></label><input id="wNew" type="password" autocomplete="new-password"></div>
          <div class="field"><label for="wNew2">Confirm new password</label><input id="wNew2" type="password" autocomplete="new-password"></div>
          <button class="btn" id="wSave">Update password</button></div>
        <div class="card"><h3>My categories</h3>
          <p class="muted" style="margin-bottom:12px">Defaults are managed by the admin. Add your own below.</p>
          <div class="row" style="margin-bottom:12px"><input id="cName" placeholder="New category name" maxlength="60">
            <select id="cType"><option value="expense">Expense</option><option value="income">Income</option></select></div>
          <button class="btn sm" id="cAdd" style="margin-bottom:14px">Add category</button>
          <div id="cList"></div></div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
